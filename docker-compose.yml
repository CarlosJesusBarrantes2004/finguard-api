services:
  db:
    image: postgres:16-alpine
    container_name: finguard_postgres
    restart: always
    environment:
      POSTGRES_DB: finguard_db
      POSTGRES_USER: finguard_user
      POSTGRES_PASSWORD: finguard_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finguard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
